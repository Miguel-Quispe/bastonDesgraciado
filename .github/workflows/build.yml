name: Compilar APK Bastón Inteligente

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema y Java 17
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zip \
            unzip

      - name: Instalar Buildozer y Cython compatible
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Compilar APK con Buildozer
        run: |
          yes | buildozer android debug

      - name: Subir artefacto APK generado
        uses: actions/upload-artifact@v4
        with:
          name: BastonApp-Debug-APK
          path: bin/*.apk
          retention-days: 14
