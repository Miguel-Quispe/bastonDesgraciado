name: Compilar APK Bastón Inteligente

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema y Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev wget
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Descargar Modelo Vosk Offline Español
        run: |
          mkdir -p model
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q vosk-model-small-es-0.42.zip
          cp -r vosk-model-small-es-0.42/* model/
          rm -rf vosk-model-small-es-0.42.zip vosk-model-small-es-0.42

      - name: Compilar APK con Buildozer
        run: |
          buildozer android debug

      - name: Subir artefacto APK generado
        uses: actions/upload-artifact@v4
        with:
          name: BastonApp-Debug-APK
          path: bin/*.apk
          retention-days: 14
