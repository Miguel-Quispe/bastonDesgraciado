name: Compilar APK Bastón Inteligente

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar Modelo Vosk Offline Español
        run: |
          mkdir -p model
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q vosk-model-small-es-0.42.zip
          cp -r vosk-model-small-es-0.42/* model/
          rm -rf vosk-model-small-es-0.42.zip vosk-model-small-es-0.42

      - name: Compilar APK con Docker Buildozer (Kivy Preconfigurado)
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Subir artefacto APK generado
        uses: actions/upload-artifact@v4
        with:
          name: BastonApp-Debug-APK
          path: ${{ steps.buildozer.outputs.filename }}
          retention-days: 14
